name: Weekly Competitor Scan

on:
  schedule:
    - cron: "0 2 * * 0"   # Every Sunday at 2 AM UTC
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write       # allows committing data/tracker.db back to repo

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main         # always checkout the latest main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run competitor scan
        run: python -m collector.main
        env:
          # Comma-separated list of domains to scan.
          # Leave empty to scan all active domains.
          SCAN_DOMAINS: ${{ vars.SCAN_DOMAINS }}

      - name: Commit updated database
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          # Save the updated DB before wiping the working tree
          cp data/tracker.db /tmp/tracker.db
          # Hard-reset to remote so working tree is perfectly clean
          git fetch origin main
          git reset --hard FETCH_HEAD
          # Restore the fresh scan results
          cp /tmp/tracker.db data/tracker.db
          git add data/tracker.db
          git diff --cached --quiet && echo "No DB changes to commit" || \
            git commit -m "chore: update scan results $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
