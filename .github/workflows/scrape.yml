name: Weekly Competitor Scan

on:
  schedule:
    - cron: "0 2 * * 0"  # Every Sunday at 02:00 UTC (low-traffic window)
  workflow_dispatch:       # Manual trigger — useful for testing

jobs:
  scan:
    runs-on: ubuntu-latest
    # SERP with 10–20s delays across 57 keywords × 3 domains ≈ 60–90 min
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the SQLite database from the previous scan so historical data
      # accumulates. On the very first run no cache exists — that's fine,
      # setup_schema.py will create a fresh DB below.
      - name: Restore database from cache
        uses: actions/cache@v4
        with:
          path: data/tracker.db
          key: tracker-db-${{ github.run_id }}
          restore-keys: |
            tracker-db-

      # Initialise the DB (creates tables + seeds domains/keywords if missing).
      # Skips rows that already exist, so safe to run on every scan.
      - name: Initialise database
        run: python3 setup_schema.py
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Run competitor scan
        run: python -m collector.main
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      # Upload the updated DB as a downloadable artifact (90-day retention).
      # This gives you a point-in-time snapshot of every weekly scan.
      - name: Upload database snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-db-${{ github.run_number }}
          path: data/tracker.db
          retention-days: 90
